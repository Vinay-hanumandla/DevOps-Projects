# last_verified: 2026-10-06 · Prometheus n/a

global:
  resolve_timeout: 5m

route:
  receiver: stack-webhook
  group_by:
    - alertname
    - job
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - match:
        severity: warning
      receiver: stack-webhook

receivers:
  - name: stack-webhook
    webhook_configs:
      # Placeholder endpoint — replace with a real listener before relying on
      # deliveries. Failures here surface as the AlertmanagerNotificationsFailing alert.
      - url: "http://localhost:5001/alerts"
        send_resolved: true
