# last_verified: 2026-10-13 · Prometheus n/a
#
# Purpose: wire Prometheus to Kubernetes end to end — node service discovery,
# a kube-state-metrics scrape job, static blackbox probes, recording rules,
# alerting rules built on those recordings, and a two-receiver Alertmanager
# routing tree.
# When to use: as the config-plus-RBAC layer on a cluster where Prometheus
# and Alertmanager already run (for a batteries-included Deployment pair, see
# manifests/local-monitoring-stack.yaml — this file complements it, it does
# not replace it).
# Prerequisites: namespace `monitoring` exists; a kube-state-metrics Service
# named `kube-state-metrics` with a port named `http-metrics` is deployed; a
# blackbox exporter Service named `blackbox-exporter` listens on 9115.
# Mount table (wire these into the Prometheus container):
#   ConfigMap prometheus-k8s / key prometheus.yml       -> /etc/prometheus/prometheus.yml
#   ConfigMap prometheus-recording-rules / key recording-rules.yml -> /etc/prometheus/recording-rules.yml
#   ConfigMap prometheus-alerting-rules / key alerting-rules.yml   -> /etc/prometheus/alerting-rules.yml
#   ConfigMap alertmanager-routing / key alertmanager.yml -> /etc/alertmanager/alertmanager.yml
# Steps:
#   1. kubectl apply -f prom/manifests/k8s-service-discovery-recording-rules-alertmanager.yaml
#   2. Mount the four ConfigMaps per the table above and restart Prometheus.
# Verify:
#   1. promtool check config /etc/prometheus/prometheus.yml
#   2. promtool check rules /etc/prometheus/recording-rules.yml /etc/prometheus/alerting-rules.yml
#   3. amtool check-config /etc/alertmanager/alertmanager.yml
#   4. In the Prometheus UI, Targets shows kubernetes-nodes, kube-state-metrics
#      and blackbox-probes as UP; the recording rules appear under Rules.
# Common errors:
#   - kube-state-metrics targets missing: Service name or port name does not
#     match the keep filters; check with kubectl get svc kube-state-metrics.
#   - 403 on kubernetes-nodes: ClusterRoleBinding points at the wrong
#     ServiceAccount or namespace; compare subjects against the account below.
#   - HighErrorRatio never fires: no job exports http_requests_total, so the
#     recording rule has no input series — expected until an instrumented app
#     is scraped.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-k8s
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
      - job_name: kubernetes-nodes
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node

      - job_name: kube-state-metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - monitoring
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: kube-state-metrics
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http-metrics

      - job_name: blackbox-probes
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - https://example.local/healthz
              - https://example.local/readyz
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115

    rule_files:
      - /etc/prometheus/recording-rules.yml
      - /etc/prometheus/alerting-rules.yml

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-recording-rules
  namespace: monitoring
data:
  recording-rules.yml: |
    groups:
      - name: request-rates
        interval: 30s
        rules:
          - record: job:http_requests:rate5m
            expr: sum by (job) (rate(http_requests_total[5m]))
          - record: job:http_errors:ratio5m
            expr: |
              sum by (job) (rate(http_requests_total{status=~"5.."}[5m]))
              /
              sum by (job) (rate(http_requests_total[5m]))

      - name: node-capacity
        interval: 1m
        rules:
          - record: instance:node_cpu_utilisation:ratio
            expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerting-rules
  namespace: monitoring
data:
  alerting-rules.yml: |
    groups:
      - name: k8s-health
        rules:
          - alert: KubeNodeUnreachable
            expr: up{job="kubernetes-nodes"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} unreachable"

          - alert: HighErrorRatio
            expr: job:http_errors:ratio5m > 0.05
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High 5xx ratio on {{ $labels.job }}"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-routing
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: team-warning
      group_by: [alertname, job]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers: [severity = critical]
          receiver: team-critical
          continue: true
        - matchers: [severity = warning]
          receiver: team-warning

    receivers:
      - name: team-critical
        webhook_configs:
          - url: http://alert-gateway:5001/critical
            send_resolved: true
      - name: team-warning
        webhook_configs:
          - url: http://alert-gateway:5001/warning
            send_resolved: true

    inhibit_rules:
      - source_match:
          severity: critical
        target_match:
          severity: warning
        equal: [alertname, job]

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-k8s
  namespace: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-k8s
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-k8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-k8s
subjects:
  - kind: ServiceAccount
    name: prometheus-k8s
    namespace: monitoring
