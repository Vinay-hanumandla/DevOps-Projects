# last_verified: 2026-09-18 · Prometheus n/a

global:
  external_labels:
    cluster: "<cluster-name>"

# Option A: send local series to one or more remote storage endpoints.
remote_write:
  - url: "<primary-remote-write-endpoint>"
  - url: "<secondary-remote-write-endpoint>"

# Option B: scrape a peer Prometheus endpoint for selected series.
# Keep this job only when federation is the chosen aggregation path.
scrape_configs:
  - job_name: federation
    honor_labels: true
    metrics_path: /federate
    params:
      match[]:
        - '{job=~".+"}'
    static_configs:
      - targets: ["<peer-prometheus-endpoint>"]
