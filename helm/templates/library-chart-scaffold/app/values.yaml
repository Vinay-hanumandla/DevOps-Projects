# last_verified: 2026-09-26 · Helm n/a
# Baseline values for the web-api chart.
# Every key here is constrained by values.schema.json —
# an override that breaks the schema fails `helm lint`
# and `helm template` before anything is rendered.
replicaCount: 1

image:
  repository: myregistry.io/web-api
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

commonLabels: {}
