# last_verified: 2026-09-26 · Helm n/a
# Base defaults for my-service.
# Environment override files only change what differs;
# everything else falls through from here.
replicaCount: 1

image:
  repository: myregistry.io/my-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
