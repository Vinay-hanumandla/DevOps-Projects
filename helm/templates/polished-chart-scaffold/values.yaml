# last_verified: 2026-10-19 · Helm 3.13
# Defaults consumed by templates. Environment differences live in
# ci/<env>-values.yaml and override only the keys that differ.
replicaCount: 1
image:
  repository: myregistry.io/polished-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi