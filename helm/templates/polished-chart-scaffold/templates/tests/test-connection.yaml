# last_verified: 2026-10-19 · Helm 3.13
# Test hook: a pod that curls the service health endpoint after install.
# helm test runs this Job in the release namespace.
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-connection
  labels:
    {{- include "polished-service.selector" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: curlimages/curl:8.12.1
      command:
        - "sh"
        - "-c"
        - 'curl -sf http://{{ .Release.Name }}:{{ .Values.service.port }}/healthz'