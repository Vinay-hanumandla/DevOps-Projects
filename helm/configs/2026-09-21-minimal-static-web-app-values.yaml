# last_verified: 2026-09-21 · helm n/a
#
# Minimal values.yaml for a static web app (nginx) Helm chart.
# This is the kind of values file you'd create after running `helm create my-web-app`
# and then stripping it down to just what a static site needs.
#
# Override any of these at install/upgrade time with `-f values-prod.yaml` or `--set key=value`.

replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "1.27-alpine"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Static site specific: inject site content via configMap
# Enable this and provide your HTML/CSS/JS in the configMap section below
staticContent:
  enabled: true
  configMap:
    # Either create the ConfigMap separately and reference it here:
    # name: my-site-content
    # Or let the chart create it from these literal files:
    create: true
    files:
      index.html: |
        <!DOCTYPE html>
        <html>
        <head><title>Welcome</title></head>
        <body><h1>Static site deployed via Helm</h1></body>
        </html>
      # Add more files as needed:
      # style.css: |
      #   body { font-family: sans-serif; }