# last_verified: 2026-09-07 · git n/a
# Branch-protection enforcement workflow. Runs on every push to the
# protected branch and re-applies the protection policy so the rules
# stay in sync with what is written here.
name: Enforce branch protection

on:
  push:
    branches:
      - main

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Apply branch protection policy
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';

            await github.rest.repos.updateBranchProtection({
              owner,
              repo,
              branch,
              required_status_checks: {
                strict: true,
                contexts: ['ci/test', 'ci/lint'],
              },
              enforce_admins: true,
              required_pull_request_reviews: {
                required_approving_review_count: 1,
                dismiss_stale_reviews: true,
                require_code_owner_reviews: true,
                required_review_thread_resolution: true,
              },
              allow_force_pushes: false,
              allow_deletions: false,
              required_linear_history: true,
              required_signatures: true,
              restrictions: null,
            });