# last_verified: 2026-10-11 · github-actions n/a
name: Terraform Module Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Terratest (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23']
    defaults:
      run:
        working-directory: ./modules/example-module
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Download Terratest dependencies
        run: go mod download

      - name: Run Terratest suite
        run: go test -v -timeout 20m -parallel 2 ./test/...

      - name: Validate module (no backend)
        run: |
          terraform init -backend=false
          terraform validate

      - name: Check formatting
        run: terraform fmt -check -diff