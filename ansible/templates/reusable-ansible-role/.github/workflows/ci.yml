# last_verified: 2026-10-20 · ansible n/a
name: ci
on:
  push:
  pull_request:
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install molecule molecule-plugins[docker] ansible-lint galaxy-importer
      - name: Build the collection
        run: ansible-galaxy collection build -o .
      - name: Run molecule tests
        run: molecule test
      - name: galaxy-importer lint
        run: galaxy-importer lint ./example_org-app_role-1.0.0.tar.gz
