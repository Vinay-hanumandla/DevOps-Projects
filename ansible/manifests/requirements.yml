# last_verified: 2026-10-20 · ansible 2.21.5
# ansible-034 — Galaxy collections installed into the curated execution environment.
# Read by ansible-builder via the `dependencies.galaxy` key in the EE manifest.
# Every entry is pinned to the exact release the automation is tested against.
# Replace versions when the test matrix validates a newer release.
collections:
  # Network automation (NetOps Q3 2026 releases)
  - name: cisco.ios
    version: "11.5.1"
    source: https://galaxy.ansible.com
  - name: cisco.nxos
    version: "12.1.0"
    source: https://galaxy.ansible.com
  - name: cisco.iosxr
    version: "12.4.2"
    source: https://galaxy.ansible.com
  - name: arista.eos
    version: "12.2.0"
    source: https://galaxy.ansible.com
  - name: ansible.netcommon
    version: "8.6.2"
    source: https://galaxy.ansible.com
  - name: ansible.utils
    version: "6.1.0"
    source: https://galaxy.ansible.com

  # Cloud provisioning
  - name: amazon.aws
    version: "7.5.0"
    source: https://galaxy.ansible.com
  - name: community.aws
    version: "7.2.0"
    source: https://galaxy.ansible.com
  - name: azure.azcollection
    version: "2.5.0"
    source: https://galaxy.ansible.com
  - name: google.cloud
    version: "1.3.0"
    source: https://galaxy.ansible.com

  # Platform operations (AAP 2.7 ansible.platform collection)
  - name: ansible.platform
    version: "1.2.0"
    source: https://galaxy.ansible.com

  # Core utilities
  - name: ansible.posix
    version: "2.0.0"
    source: https://galaxy.ansible.com
  - name: community.general
    version: "9.2.0"
    source: https://galaxy.ansible.com
  - name: community.kubernetes
    version: "2.6.0"
    source: https://galaxy.ansible.com

# Roles are not used in this curated EE; add a `roles:` key only when
# Galaxy roles are required by the automation.