# last_verified: 2026-08-24 · python n/a

# 2026-08-24-pyproject-toml-config.toml — my first pyproject.toml
# I started with the PEP 621 minimal example and added a build-system
# table so `pip install -e .` works out of the box. Still figuring out
# which optional dependencies belong in [project.optional-dependencies].

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-learning-project"
version = "0.1.0"
description = "A sample project for learning Python packaging with pyproject.toml"
authors = [
    { name = "Learner", email = "learner@example.com" }
]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "requests",
    "pyyaml"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
