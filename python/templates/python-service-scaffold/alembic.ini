# last_verified: 2026-10-03 · python n/a
# The connection string is deliberately absent: alembic/env.py reads it from the
# application settings so the migrations and the app cannot drift apart.

[alembic]
script_location = alembic
prepend_sys_path = src

# Logging configuration handed to logging.config.fileConfig by alembic/env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S