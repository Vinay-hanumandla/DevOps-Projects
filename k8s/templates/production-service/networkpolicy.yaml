# last_verified: 2026-10-07 · kubernetes n/a
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkout-api
  labels:
    app: checkout-api
spec:
  podSelector:
    matchLabels:
      app: checkout-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: checkout-api
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
