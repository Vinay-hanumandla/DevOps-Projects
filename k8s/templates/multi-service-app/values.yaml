# Default values for the multi-service-app chart.
# Override with `-f my-values.yaml` or `--set key=value` at install time.
# Image tags are pinned placeholders — point them at the registry you push to.

frontend:
  replicas: 2
  image:
    repository: multi-service-frontend
    tag: "0.1.0"
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

backend:
  replicas: 2
  image:
    repository: multi-service-backend
    tag: "0.1.0"
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: nginx
  host: app.example.local
  path: /
  pathType: Prefix

monitoring:
  # Adds prometheus.io scrape annotations to both Services.
  scrapeAnnotations: true
  metricsPortName: http
