# last_verified: 2026-08-17 · bash 5.3
# Multi-container stack for the health-check scaffold. Every service declares a
# healthcheck backed by the shared app/healthcheck.sh script; `depends_on` uses
# the service_healthy condition so compose refuses to start web before cache is
# healthy and worker before web is healthy. The cache service sets
# SKIP_ENTRYPOINT_WAIT=true so its entrypoint hook does not wait for itself;
# web and worker wait for the cache dependency before their CMD runs.
name: bash-docker-healthcheck-scaffold

services:
  cache:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/opt/app/app/responder.sh", "6379"]
    environment:
      SKIP_ENTRYPOINT_WAIT: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/app/app/healthcheck.sh --port 6379"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/opt/app/app/responder.sh", "8080"]
    environment:
      CACHE_HOST: cache
      CACHE_PORT: "6379"
    depends_on:
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/opt/app/app/healthcheck.sh --port 8080"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s
    ports:
      - "8080:8080"
    networks:
      - internal

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/opt/app/app/main.sh"]
    environment:
      CACHE_HOST: cache
      CACHE_PORT: "6379"
    healthcheck:
      test: ["CMD-SHELL", "/opt/app/app/healthcheck.sh --port 6379 --host cache"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 5s
    depends_on:
      cache:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
