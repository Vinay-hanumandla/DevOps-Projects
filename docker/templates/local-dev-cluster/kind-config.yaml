# last_verified: 2026-09-20 · Docker n/a
# kind cluster configuration: 1 control-plane + 2 workers.
# extraPortMappings on the control-plane expose HTTP/HTTPS so
# services published by Compose are reachable from the host,
# and ingress controllers can bind standard ports.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
      - containerPort: 443
        hostPort: 443
  - role: worker
  - role: worker
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
      SystemdCgroup = true
