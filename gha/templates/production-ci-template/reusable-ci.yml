# last_verified: 2026-10-19 · gha n/a
name: Reusable CI

on:
  workflow_call:
    inputs:
      language-version:
        description: 'Python version to test against'
        type: string
        required: true
      os:
        description: 'Operating system to run on'
        type: string
        required: true
      cache-suffix:
        description: 'Suffix for cache key'
        type: string
        required: true
    outputs:
      test-result:
        description: 'Test result summary'
        value: ${{ jobs.ci.outputs.test-result }}
      coverage-file:
        description: 'Path to coverage XML'
        value: ${{ jobs.ci.outputs.coverage-file }}
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    name: CI (${{ inputs.os }}, Python ${{ inputs.language-version }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 15
    outputs:
      test-result: ${{ steps.test.outputs.summary }}
      coverage-file: ${{ steps.coverage.outputs.file }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ inputs.language-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ inputs.language-version }}
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml
            **/poetry.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .[dev]; fi

      - name: Run linters
        run: |
          ruff check .
          mypy --strict .

      - name: Run tests with coverage
        id: test
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term-missing
          echo "summary=tests passed" >> "$GITHUB_OUTPUT"

      - name: Upload coverage artifact
        id: coverage
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0c0fb17bf34 # v4.6.1
        with:
          name: coverage-${{ inputs.cache-suffix }}
          path: coverage.xml
          retention-days: 7

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@c5b03e5e3b9e4b8d0f0c1a5e9d8f7e6a4b3c2d1e # v3.25.3
        with:
          sarif_file: results.sarif
          category: ${{ inputs.os }}-${{ inputs.language-version }}