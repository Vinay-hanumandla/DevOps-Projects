# last_verified: 2026-10-19 · gha n/a
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    name: Lint & Test (${{ matrix.os }}, ${{ matrix.language-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        language-version: ['3.11', '3.12', '3.13']
        include:
          - os: ubuntu-latest
            language-version: '3.11'
            cache-key-suffix: 'linux-py311'
          - os: ubuntu-latest
            language-version: '3.12'
            cache-key-suffix: 'linux-py312'
          - os: ubuntu-latest
            language-version: '3.13'
            cache-key-suffix: 'linux-py313'
          - os: macos-latest
            language-version: '3.12'
            cache-key-suffix: 'macos-py312'
          - os: windows-latest
            language-version: '3.12'
            cache-key-suffix: 'windows-py312'
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.language-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.language-version }}
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml
            **/poetry.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .[dev]; fi

      - name: Run linters
        run: |
          ruff check .
          mypy --strict .

      - name: Run tests with coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@c5b03e5e3b9e4b8d0f0c1a5e9d8f7e6a4b3c2d1e # v3.25.3
        with:
          sarif_file: results.sarif
          category: ${{ matrix.os }}-${{ matrix.language-version }}

  build-and-push:
    name: Build & Push Image
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f866f4afd0a9e016615406982a8 # v3.6.1

      - name: Log in to Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@8e5da667c75b9f3a0c5e8b5c5f4b3a2e1f0d9c8b7 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@471d1dc4e0e611ec0a3f5c5b5e6f4d3c2b1a0f9e8 # v6.15.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  security-scan:
    name: Security Scan
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@c5b03e5e3b9e4b8d0f0c1a5e9d8f7e6a4b3c2d1e # v3.25.3
        with:
          sarif_file: trivy-results.sarif

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@c5b03e5e3b9e4b8d0f0c1a5e9d8f7e6a4b3c2d1e # v3.25.3
        with:
          category: "/language:python"