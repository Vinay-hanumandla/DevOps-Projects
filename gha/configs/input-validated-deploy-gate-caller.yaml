# last_verified: 2026-10-02 · gha n/a
#
# Purpose: caller workflow for the input-validated deploy gate
#   (input-validated-deploy-gate/action.yml). Demonstrates the three mechanics
#   the action provides:
#
#   1. defaults make it callable with zero arguments — the plan job passes no
#      inputs and gets a validated staging plan with applied='skipped'.
#   2. inputs can be overridden per call — the staging job passes mode 'apply'
#      with 2 replicas and gets applied='true'; the prod job plans against
#      prod without needing the confirm-prod safety switch.
#   3. outputs gate downstream work — the report job only runs when the
#      upstream staging call reports applied='true'.
#
# Verify: push to a branch and check the Actions summary — the plan job
#   reports applied='skipped', the staging job reports applied='true', and
#   the report job echoes both upstream outputs.

name: input-validated-deploy-gate-caller

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  plan-defaults:
    name: Plan with defaults
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.gate.outputs.environment }}
      mode: ${{ steps.gate.outputs.mode }}
      applied: ${{ steps.gate.outputs.applied }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run deploy gate (defaults)
        id: gate
        uses: ./gha/configs/input-validated-deploy-gate

  staging-apply:
    name: Apply to staging
    runs-on: ubuntu-latest
    outputs:
      applied: ${{ steps.gate.outputs.applied }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run deploy gate for staging apply
        id: gate
        uses: ./gha/configs/input-validated-deploy-gate
        with:
          environment: 'staging'
          mode: 'apply'
          replicas: '2'

      - name: Confirm apply ran
        if: ${{ steps.gate.outputs.applied != 'true' }}
        run: |
          echo "Expected applied 'true', got '${{ steps.gate.outputs.applied }}'"
          exit 1

  prod-plan:
    name: Plan against prod
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run deploy gate for prod plan
        id: gate
        uses: ./gha/configs/input-validated-deploy-gate
        with:
          environment: 'prod'
          mode: 'plan'
          replicas: '3'

      - name: Confirm apply was skipped
        if: ${{ steps.gate.outputs.applied != 'skipped' }}
        run: |
          echo "Expected applied 'skipped', got '${{ steps.gate.outputs.applied }}'"
          exit 1

  report:
    name: Report gate outcomes
    runs-on: ubuntu-latest
    needs: [plan-defaults, staging-apply]
    if: ${{ needs.staging-apply.outputs.applied == 'true' }}
    steps:
      - name: Announce gate results
        run: |
          echo "Defaults call: environment='${{ needs.plan-defaults.outputs.environment }}' applied='${{ needs.plan-defaults.outputs.applied }}'"
          echo "Staging call applied='${{ needs.staging-apply.outputs.applied }}'"
