# last_verified: 2026-10-02 · gha n/a
name: 'Repository dispatch with Octokit retry'
description: 'Dispatches a repository event using Octokit with exponential backoff retry logic.'

inputs:
  token:
    description: 'GitHub token with repo scope for the target repository.'
    required: true
  repository:
    description: 'Target repository in owner/name format.'
    required: true
  event-type:
    description: 'Custom event type name for the repository_dispatch webhook.'
    required: true
  client-payload:
    description: 'JSON payload to send with the dispatch event.'
    required: false
    default: '{}'
  max-retries:
    description: 'Maximum number of retry attempts for transient failures.'
    required: false
    default: '3'
  base-delay-ms:
    description: 'Base delay in milliseconds for exponential backoff.'
    required: false
    default: '1000'

outputs:
  dispatch-id:
    description: 'ID of the created repository dispatch event (empty on failure).'
  status:
    description: 'Final status: success, rate-limited, or failed.'

runs:
  using: 'node20'
  main: 'index.js'