# Prometheus scrape config for the local observability stack.
# Job names match the Compose service names so DNS resolution works
# on the default Compose network without extra configuration.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100
